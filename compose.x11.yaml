# X11 display. Weaker than Wayland: X11 clients can keylog each other.
services:
  x-grant:
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /xauth
        read_only: true
        bind: { create_host_path: false }
  telegram:
    uts: host                                  # X cookies and GNOME dock grouping need the host's hostname.
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /share/.xauth
      QT_QPA_PLATFORM: xcb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
