# Rootless Podman: `podman compose up -d`. Container root is your uid on the host; Telegram's
# uid 65534 is an unused subuid (165533 with the usual /etc/subuid range).
services:
  # Grants Telegram the display and downloads (ACLs), then owns and firewalls the network
  # namespace that Telegram joins without NET_ADMIN.
  jail:
    image: docker.io/library/alpine:3.22
    network_mode: pasta
    cap_drop: [ALL]
    # DAC_OVERRIDE: podman chowns jail-state to Telegram's uid. setfacl needs no cap: container root owns the files.
    cap_add: [NET_ADMIN, DAC_OVERRIDE]
    # The ready mark is this netns's ID. The kernel can reuse a freed netns ID, so delete the
    # old mark first, before Telegram's container is up.
    command: >-
      sh -c 'set -e; rm -f /jail/ready; apk add --no-cache acl nftables >/dev/null;
      rm -f /share/.xauth; setfacl -m u:65534:rwx /share /downloads;
      if [ -S /wayland ]; then setfacl -m u:65534:rw /wayland;
      elif [ -f /xauth ]; then cp /xauth /share/.xauth; setfacl -m u:65534:r /share/.xauth;
        d=$${DISPLAY#*:}; setfacl -m u:65534:rw /tmp/.X11-unix/X$${d%.*};
      else echo "no display mounted: set COMPOSE_FILE in .env, see README"; exit 1; fi;
      nft -f /jail.nft; readlink /proc/self/ns/net > /jail/ready; exec sleep infinity'
    volumes:
      - ./jail.nft:/jail.nft:ro
      - jail-state:/jail
      - ./share:/share
      - ${XDG_DOWNLOAD_DIR:?not set; create .env, see README}/Telegram Desktop:/downloads
    restart: "no"

  telegram:
    build: { context: image, dockerfile: Containerfile }
    depends_on: [jail]
    network_mode: service:jail
    # Podman can't exec into these containers (oom_score_adj), so no healthcheck; wait for the mark.
    entrypoint:
      - sh
      - -c
      - 'for i in $$(seq 300); do [ "$$(cat /jail/ready 2>/dev/null)" = "$$(readlink /proc/self/ns/net)" ] && exec /opt/Telegram/Telegram $${TG_URL:+-- "$$TG_URL"}; sleep 0.1; done; echo "jail never finished, see: podman logs telegram-podman-sandboxed-jail-1"; exit 1'
    init: true                                 # Else stop waits 10 s: PID 1 ignores SIGTERM.
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    shm_size: 1g
    pids_limit: 4096
    mem_limit: 6g
    environment:
      XDG_RUNTIME_DIR: /tmp
      TG_URL: ${TG_URL:-}                      # tg:// link to open at start, from launch.sh.
      # Podman allows user namespaces, but Firefox's sandbox then fails chroot (EPERM) and every
      # tab crashes. This makes it skip them and keep its seccomp sandbox.
      MOZ_ASSUME_USER_NS: "0"
    volumes:
      - jail-state:/jail:ro
      - tg-home:/home/telegram
      - tg-bin:/opt/Telegram                   # Writable for the updater.
      - ./share:/share
      - ${XDG_DOWNLOAD_DIR}:/home/telegram/Downloads:ro
      - ${XDG_DOWNLOAD_DIR}/Telegram Desktop:/home/telegram/Downloads/Telegram Desktop
      - ${XDG_DOWNLOAD_DIR}:${XDG_DOWNLOAD_DIR}:ro   # Drag and drop uses host paths.
      - /etc/localtime:/etc/localtime:ro
    restart: "no"

volumes:
  jail-state:
  tg-home:
  tg-bin:
