# Wayland display.
services:
  jail:
    volumes:
      - &socket
        type: bind
        source: ${XDG_RUNTIME_DIR:?not set; run from your desktop session}/${WAYLAND_DISPLAY:-wayland-0}
        target: /wayland
        bind: { create_host_path: false }
  telegram:
    environment:
      WAYLAND_DISPLAY: /wayland
      QT_QPA_PLATFORM: wayland
      MOZ_ENABLE_WAYLAND: "1"
    volumes: [*socket]
